services:
  website:
    build: ./website
    container_name: multi-website
    ports:
      - "8084:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: multi-backend
    expose:
      - "5000"
    restart: unless-stopped
