name: Multi-Service App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build Backend Image
        run: docker build -t devarshi-backend:test ./backend

      - name: Build Frontend Image
        run: docker build -t devarshi-frontend:test ./website
